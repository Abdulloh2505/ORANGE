<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Location Pin -->
  <path d="M100 20 C65 20 37 48 37 83 C37 100 45 115 100 180 C155 115 163 100 163 83 C163 48 135 20 100 20 Z" 
        fill="#FF8C42" stroke="#D97326" stroke-width="3"/>
  
  <!-- Inner Circle -->
  <circle cx="100" cy="83" r="35" fill="#2C2C2C" opacity="0.3"/>
  
  <!-- Coffee Cup -->
  <g transform="translate(100, 83)">
    <!-- Cup Body -->
    <path d="M-15 -8 L-12 8 C-12 10 -8 12 0 12 C8 12 12 10 12 8 L15 -8 Z" 
          fill="#FF8C42" stroke="#D97326" stroke-width="1.5"/>
    
    <!-- Cup Handle -->
    <path d="M15 -4 Q22 -4 22 2 Q22 8 15 8" 
          fill="none" stroke="#FF8C42" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Coffee Surface -->
    <ellipse cx="0" cy="-8" rx="15" ry="4" fill="#D97326"/>
    
    <!-- Steam -->
    <path d="M-8 -15 Q-10 -20 -8 -25" 
          fill="none" stroke="#FF8C42" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M0 -16 Q-2 -22 0 -28" 
          fill="none" stroke="#FF8C42" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M8 -15 Q10 -20 8 -25" 
          fill="none" stroke="#FF8C42" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <!-- Shadow/Base -->
  <ellipse cx="100" cy="185" rx="25" ry="8" fill="#000000" opacity="0.2"/>
</svg>